name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No key, no network, no model: the deterministic core and the evidence book must
      # pass on a bare interpreter, or a judge cannot reproduce anything.
      - name: no API key present
        run: test -z "${CMC_API_KEY:-}" && echo "running keyless, as a judge would"
      - run: python3 test_math.py
      - run: python3 test_forward.py
      - run: python3 test_extract.py
